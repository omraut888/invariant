# `uv run pre-commit install` installs both hook types below (default_install_hook_types).
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-yaml
      - id: check-toml
  # Before every push: the task-done checks of CLAUDE.md, on the whole tree, so a broken test or
  # type error cannot be pushed. They use the locked uv environment, not pre-commit's own.
  - repo: local
    hooks:
      - id: ruff-check-all
        name: ruff check (whole tree)
        entry: uv run ruff check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: ruff-format-check
        name: ruff format --check (whole tree)
        entry: uv run ruff format --check .
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: mypy
        name: mypy (strict)
        entry: uv run mypy
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      - id: pytest-fast
        name: pytest fast suite
        entry: uv run pytest -m "not slow" -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
