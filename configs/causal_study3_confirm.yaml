# Stage 1 confirmation study: the study 3 deviation (hc3|hybrid) on a fresh root seed
# (docs/adr/0009, "Confirmation of the study 3 deviation").
# Read by scripts/causal_ci_size_study.py --config configs/causal_study3_confirm.yaml.
# The rule was fixed and pushed before any result of this study was seen.

scenario_set: study3    # the 11 study-3 gates, plus the non-gating T = 500 Stambaugh diagnostic
root_seed: 20261018     # fresh: never used by studies 1-3 (20261014)
n_seeds: null           # required_seeds(alpha, size_cutoff, n_gating = 11, all_pass_prob) = 1785
n_obs: 6000
tau_max: 5
pc_alpha: 0.2
alpha: 0.05
size_cutoff: 0.075
all_pass_prob: 0.90
confidence: 0.95
tests:
  - {label: hc3, test: parcorr_hc3}
  - {label: cwls20, test: parcorr_wls_centered, wls_window: 20}
decisions: [hybrid]
selection_scenario: e3_default
selection_families: ["s_real->R", "s_decay->R"]
# The rule is "hc3|hybrid is admissible". The report's `selected` field is not used; these
# orders exist only because the config schema requires them with tie_break: simplicity.
tie_break: simplicity
decision_simplicity: [hybrid]
ci_simplicity: [hc3, cwls20]
