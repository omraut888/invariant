# INVARIANT Phase 0 defaults. Override with a second YAML via load_config(override_path=...).
#
# Universe: SPY, the nine original Select Sector SPDRs (inception 1998-12-16), TLT and IEF
# (inception 2002-07-22), GLD (inception 2004-11-18). GLD is the binding constraint, so the
# sample starts on the first trading day of 2005 to give a balanced panel. XLRE (2015) and XLC
# (2018) are excluded for lack of history.
#
# Known limitations (docs/adr/0001-config-layering-and-core-contracts.md):
# - Hindsight / survivorship: every ticker was chosen knowing it still trades today.
# - The 2018 GICS reshuffle moved GOOGL/META etc. out of XLK/XLY into XLC, so those two ETFs are
#   not a constant exposure across the sample.
universe:
  tickers: [SPY, XLB, XLE, XLF, XLI, XLK, XLP, XLU, XLV, XLY, TLT, IEF, GLD]

# Fixed end date, never "today": the config is part of the run hash.
dates:
  start: 2005-01-03
  end: 2025-12-31

frequency: daily

# Root seed for all np.random.Generator objects in a run.
seed: 20260105

# Data sources (docs/adr/0004-data-sources-and-pit-limitations.md). Snapshots of fetched data are
# immutable and content-addressed (docs/adr/0005-immutable-snapshots.md).
data:
  calendar: XNYS          # exact session calendar for ETF missing-data checks
  http:
    timeout_s: 60
    max_retries: 3        # retried on transport errors, 429 and 5xx
    backoff_s: 1.0        # sleep backoff_s * 2**attempt between attempts
  french:
    five_factor_url: https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/ftp/F-F_Research_Data_5_Factors_2x3_daily_CSV.zip
    momentum_url: https://mba.tuck.dartmouth.edu/pages/faculty/ken.french/ftp/F-F_Momentum_Factor_daily_CSV.zip
  alfred:
    series: [INDPRO, UNRATE, CPIAUCSL, PAYEMS]
    page_size: 100000     # FRED API maximum per request; responses are paginated

# Point-in-time panel (docs/adr/0006-point-in-time-panel.md).
pit:
  targets:
    execution_lag: 1      # enter at the close of t+1: a close-t feature cannot trade at close t
    horizon: 1            # target y_t = r_{t+2} (sessions); see TargetConfig
  publication_lag_sessions:
    french: 42            # ~2 months: each library release covers data through the prior month
