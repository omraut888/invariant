[project]
name = "invariant"
version = "0.1.0"
description = "A quant research pipeline that tries to kill every candidate signal, validated on a planted-signal benchmark"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "omraut888", email = "omraut0888@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "clarabel>=0.11.1",
    "exchange-calendars>=4.13.2",
    "httpx>=0.28.1",
    "joblib>=1.6.0",
    "numba>=0.68.0",
    "numpy>=2.4.6",
    "pandas>=3.0.6",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scipy>=1.17.1",
    "structlog>=26.1.0",
    "tigramite>=5.2.10.1",
    "yfinance>=1.7.0",
]

[build-system]
requires = ["uv_build>=0.9.5,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "arch>=8.0.0",
    "cvxpy>=1.9.3",
    "hypothesis>=6.168.4",
    "ipykernel>=7.4.0",
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
    "statsmodels>=0.15.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "NPY", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
# src/ is the base for `invariant`; the repo root is the base for tests (no __init__.py files
# there), so test modules are named tests.unit.test_x and can be targeted as `tests.*`.
mypy_path = ["src", "$MYPY_CONFIG_FILE_DIR"]
explicit_package_bases = true
files = ["src/invariant", "tests", "scripts"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
  "yfinance.*", "exchange_calendars.*", "pyarrow.*", "scipy.*", "statsmodels.*",
  "tigramite.*",  # untyped; contained in stages/causal/{ci_tests,pcmci}.py
  "joblib.*",     # untyped
  "numba.*",      # untyped; njit is cast to a typed decorator in stages/adversarial/regimes.py
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# cvxpy ships py.typed but star-exports its atoms, so mypy sees no `cp.norm` and an untyped
# `Problem.solve`. Skipped (treated as Any); used only in tests/unit/test_dro_robust.py as the
# reference formulation. clarabel is a compiled extension without stubs; contained in
# stages/dro/robust.py.
module = ["cvxpy", "cvxpy.*", "clarabel", "clarabel.*"]
follow_imports = "skip"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# Repo root on sys.path so tests can share helpers as `tests.fixtures.<module>`.
pythonpath = ["."]
addopts = "-ra --strict-markers"
markers = [
  "slow: long-running tests",
  "benchmark: planted-signal ground-truth tests",
  "leakage: look-ahead bias guards",
]
