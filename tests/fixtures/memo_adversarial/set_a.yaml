# Hand-written adversarial set (a), docs/adr/0017.
#
# Written before the verifier (verify.py) existed, from the memo format and the corruption
# classes K1-K9 only. Frozen once committed: entries are added in a new file, never edited.
#
# Each entry: id, case (a fixture under tests/fixtures/memo_runs/), class (K1-K9, or S for a
# structural attack on the memo format), expect (reject, or accept for a benign narrative
# sentence: false rejections are reported, not gated), a note, and ops
# (stages/memo/corruption.py). Unless an op says md: keep, memo.md is re-rendered from the edited
# memo.json, so the tamperer controls both files.
set: a
entries:
  # --- K1: a wrong number ------------------------------------------------------------------
  - id: a01
    case: pass_multi
    class: K1
    expect: reject
    note: a partial correlation nudged in its last digit, in memo.md
    ops: [{op: md_replace, old: "| SYN02, lag 1 | 0.080 [", new: "| SYN02, lag 1 | 0.081 ["}]
  - id: a02
    case: pass_multi
    class: K1
    expect: reject
    note: the net Sharpe in the gross-Sharpe caveat, digits transposed
    ops: [{op: md_replace, old: "net-of-cost Sharpe ratio is 1.37", new: "net-of-cost Sharpe ratio is 1.73"}]
  - id: a03
    case: pass_multi
    class: K1
    expect: reject
    note: the sign of B's lower bound flipped, which hides that s_real's interval includes zero
    ops: [{op: md_replace, old: "| s_real | 0.30 [-0.06, 0.66]", new: "| s_real | 0.30 [0.06, 0.66]"}]
  - id: a04
    case: pass_multi
    class: K1
    expect: reject
    note: two members' B values swapped in the table (both files consistent)
    ops:
      - {op: atom_replace, old: "{fact:portfolio.s_real.b|value}", new: "{fact:portfolio.s_conf.b|value}"}
  - id: a05
    case: hidden_confounder
    class: K1
    expect: reject
    note: Ridge-CV's LW p moved below alpha, which would mean a pass
    ops: [{op: md_replace, old: "| Ridge-CV | 0.58 | 0.35 | 0.961 | 0.073 |", new: "| Ridge-CV | 0.58 | 0.35 | 0.961 | 0.037 |"}]
  - id: a06
    case: pass_multi
    class: K1
    expect: reject
    note: the out-of-sample day count
    ops: [{op: md_replace, old: "over 4738 out-of-sample days", new: "over 4783 out-of-sample days"}]
  - id: a07
    case: pass_multi
    class: K1
    expect: reject
    note: a quoted benchmark rate shrunk tenfold, interval included
    ops: [{op: md_replace, old: "passed Stage 1 in 0.730 [0.689, 0.767]", new: "passed Stage 1 in 0.073 [0.069, 0.077]"}]
  - id: a08
    case: stage2_short
    class: K1
    expect: reject
    note: the design-row count in a not-tested cell
    ops: [{op: md_replace, old: "| s_decay | not tested | 3989 design rows", new: "| s_decay | not tested | 5989 design rows"}]
  - id: a09
    case: pass_multi
    class: K1
    expect: reject
    note: the high-volatility share in the stress caveat
    ops: [{op: md_replace, old: "0.30 of days fall in it", new: "0.03 of days fall in it"}]
  - id: a10
    case: pass_multi
    class: K1
    expect: reject
    note: the run seed in the reproducibility block
    ops: [{op: md_replace, old: "run seed = 4;", new: "run seed = 0;"}]
  - id: a11
    case: pass_multi
    class: K1
    expect: reject
    note: the deciding arm's gross Sharpe swapped for the best DRO arm's (both files consistent)
    ops:
      - {op: atom_replace, old: "{fact:portfolio.ridge_cv.sharpe|value}", new: "{fact:portfolio.dro_cv.sharpe|value}"}
  - id: a12
    case: hidden_confounder
