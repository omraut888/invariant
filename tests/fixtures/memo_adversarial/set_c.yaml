# Adversarial set (c), docs/adr/0017 deviation 1. Written 2026-10-31 by an independent agent
# given only the template-only memo format, the fixture memos, the edit operations and the class
# definitions; never the verifier, sets (a)/(b) or the ADR. Frozen as written, before the
# verifier is run on it.
set: c
entries:
