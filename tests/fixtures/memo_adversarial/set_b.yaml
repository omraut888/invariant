  - id: b_k6_07
    case: realistic
    class: K6
    expect: reject
    note: not_detectable caveat reworded to claim good power
    ops:
      - {op: text_replace, old: "The test has little power against weak edges.", new: "The test has good power against all but the weakest edges."}
  - id: b_k6_08
    case: pass_multi
    class: K6
    expect: reject
    note: narrative hedge dismissing the hidden-confounder caveat as theoretical
    ops:
      - {op: insert_llm, section: causal, text: "The hidden-confounder caveat below is largely theoretical for a run like this one."}
  - id: b_k6_09
    case: not_decided
    class: K6
    expect: reject
    note: triggered not_decided caveat deleted
    ops:
