  - id: b_k6_11
    case: pass_multi
    class: K6
    expect: reject
    note: stage4 caveat's sample length reworded twenty-four -> forty years
    ops:
      - {op: text_replace, old: "At about twenty-four years of daily data", new: "At about forty years of daily data"}
  - id: b_k6_12
    case: portfolio_kill
    class: K6
    expect: reject
    note: gross_sharpe caveat inverted ('real costs are likely lower')
    ops:
