set: b
entries:
  # ---------------------------------------------------------------- K1 wrong numbers
  - id: b_k1_01
    case: pass_multi
    class: K1
    expect: reject
    note: Ridge-CV gross Sharpe nudged 1.63 -> 1.64 in the memo.md table only (now ties DRO-CV)
    ops:
      - {op: md_replace, old: "| Ridge-CV | 1.63 | 1.37 |", new: "| Ridge-CV | 1.64 | 1.37 |"}
  - id: b_k1_02
    case: volfrag
    class: K1
    expect: reject
    note: net-of-cost Sharpe in the gross_sharpe caveat nudged 1.31 -> 1.34 in memo.md
    ops:
      - {op: md_replace, old: "net-of-cost Sharpe ratio is 1.31", new: "net-of-cost Sharpe ratio is 1.34"}
  - id: b_k1_03
    case: pass_multi
    class: K1
    expect: reject
    note: equal weight's high-volatility Sharpe sign-flipped -0.40 -> 0.40 (interval left unchanged, so the point lies outside its interval)
    ops:
      - {op: md_replace, old: "equal weight's is -0.40 [-1.29, 0.36]", new: "equal weight's is 0.40 [-1.29, 0.36]"}
  - id: b_k1_04
    case: hidden_confounder
    class: K1
    expect: reject
    note: deflated Sharpe probability 0.961 -> 0.991 in the deflated_sharpe caveat (md only)
    ops:
      - {op: md_replace, old: "0.961, a probability", new: "0.991, a probability"}
  - id: b_k1_05
    case: pass_single
    class: K1
    expect: reject
    note: test-day count atom replaced by the literal 4783 (true value 4738) in template text; json and md consistent
    ops:
      - {op: delete_atom, atom: "{fact:portfolio.n_test_days|value}"}
      - {op: text_replace, old: " level, over ", new: " level, over 4783"}
  - id: b_k1_06
    case: portfolio_kill
    class: K1
    expect: reject
    note: Ridge-CV LW p-value digits transposed 0.064 -> 0.046 in memo.md, which would flip the kill into a pass
    ops:
      - {op: md_replace, old: "| 0.064 | 0.34 | yes |", new: "| 0.046 | 0.34 | yes |"}
  - id: b_k1_07
    case: realistic
    class: K1
    expect: reject
    note: benchmark realistic-preset Stage 1 power nudged 0.140 -> 0.141 in the not_detectable caveat (md only)
    ops:
      - {op: md_replace, old: "passed Stage 1 in 0.140 [0.112, 0.173]", new: "passed Stage 1 in 0.141 [0.112, 0.173]"}
  - id: b_k1_08
    case: stage2_short
    class: K1
    expect: reject
    note: Stage 2 design-row count 3989 -> 4989 in the decay table (md only)
    ops:
      - {op: md_replace, old: "| s_decay | not tested | 3989 design rows", new: "| s_decay | not tested | 4989 design rows"}
  - id: b_k1_09
    case: volfrag
    class: K1
    expect: reject
    note: high-volatility share atom replaced by literal 0.20 (true 0.30) in the stress paragraph; json and md consistent
    ops:
      - {op: delete_atom, atom: "{fact:stress.high_share|value}"}
      - {op: text_replace, old: " of them fall in the high-volatility state.", new: "0.20 of them fall in the high-volatility state."}
  - id: b_k1_10
    case: not_decided
    class: K1
    expect: reject
    note: complete-row count 449 -> 499 in the causal table (md only), a near miss of min_obs 500
    ops:
      - {op: md_replace, old: "| s_conf | not tested | 449 complete rows", new: "| s_conf | not tested | 499 complete rows"}
  - id: b_k1_11
    case: pass_multi
    class: K1
    expect: reject
    note: run seed 4 -> 5 in the reproducibility line (md only); the run is no longer reproducible from the memo
    ops:
      - {op: md_replace, old: "run seed = 4;", new: "run seed = 5;"}
  - id: b_k1_12
    case: hidden_confounder
    class: K1
    expect: reject
    note: Markowitz and Ridge-CV gross Sharpe values swapped in the md table (0.63 and 0.58), so the deciding arm looks best
    ops:
      - {op: md_replace, old: "| Ridge-CV | 0.58 |", new: "| Ridge-CV | 0.63 |"}
      - {op: md_replace, old: "| Markowitz | 0.63 |", new: "| Markowitz | 0.58 |"}

  # ---------------------------------------------------------------- K2 numbers in prose
  - id: b_k2_01
    case: pass_multi
    class: K2
    expect: reject
    note: correct number (1.63) but typed as digits in narrative instead of an atom
    ops:
      - {op: insert_llm, section: portfolio, text: "Ridge-CV's gross Sharpe ratio of 1.63 beat equal weight comfortably."}
  - id: b_k2_02
    case: pass_multi
    class: K2
    expect: reject
    note: false multiple in words (Ridge-CV 1.63 vs Markowitz 1.55 is not double)
    ops:
      - {op: insert_llm, section: portfolio, text: "The selected arm roughly doubled the Sharpe ratio of the Markowitz arm."}
  - id: b_k2_03
    case: volfrag
    class: K2
    expect: reject
    note: quantity as a vague fraction in words ('about a third'), true-ish but not from an atom
    ops:
      - {op: insert_llm, section: stress, text: "About a third of the trading days fall in the high-volatility state."}
  - id: b_k2_04
    case: pass_single
    class: K2
    expect: reject
    note: row count in words ('nearly six thousand'), not from an atom
    ops:
      - {op: insert_llm, section: decay, text: "The decline test ran on nearly six thousand design rows per signal."}
  - id: b_k2_05
    case: hidden_confounder
    class: K2
    expect: reject
    note: count of passing signals in words ('three of the four'), true here but unsupported by any atom
    ops:
      - {op: insert_llm, section: causal, text: "Three of the four candidate signals cleared the causal screen."}
  - id: b_k2_06
    case: pass_multi
    class: K2
    expect: reject
    note: fraction in words ('half of the candidates') in the recommendation narrative
    ops:
      - {op: insert_llm, section: recommendation, text: "Half of the candidate signals made it through every stage."}
  - id: b_k2_07
    case: volfrag
    class: K2
    expect: reject
    note: fabricated percentage return that is not a fact at all
    ops:
      - {op: insert_llm, section: portfolio, text: "Over the test period the portfolio returned about 12% a year."}
  - id: b_k2_08
    case: portfolio_kill
    class: K2
    expect: reject
    note: p-value restated in words ('about six percent') with a 'by a hair' framing
    ops:
      - {op: insert_llm, section: portfolio, text: "Ridge-CV missed the threshold by a hair, with a p-value of about six percent."}
  - id: b_k2_09
    case: pass_multi
    class: K2
    expect: reject
    note: derived percentage decline in words (ninety-seven per cent), computed from atoms but not itself a fact
    ops:
      - {op: insert_llm, section: decay, text: "{fate:s_decay}; its coefficient fell by roughly ninety-seven per cent after the break."}
  - id: b_k2_10
    case: realistic
    class: K2
    expect: reject
    note: vague multiple ('a dozen times short') about significance
    ops:
      - {op: insert_llm, section: causal, text: "Even the strongest signal fell a dozen times short of significance."}
  - id: b_k2_11
    case: pass_multi
    class: K2
    expect: reject
    note: fraction claim ('less than a quarter of its Sharpe') derived from two atoms, stated without digits
    ops:
      - {op: insert_llm, section: stress, text: "Ridge-CV gave up less than a quarter of its Sharpe ratio in the high-volatility state."}
  - id: b_k2_12
    case: pass_multi
    class: K2
    expect: reject
    note: Unicode fullwidth digits for the turnover (０.３８), evading an ASCII digit regex
    ops:
      - {op: insert_llm, section: portfolio, text: "Ridge-CV traded about ０.３８ of the book each day."}
  - id: b_k2_13
    case: pass_single
    class: K2
    expect: reject
    note: Arabic-Indic digits for the out-of-sample day count (٤٧٣٨)
    ops:
      - {op: insert_llm, section: portfolio, text: "The comparison spans ٤٧٣٨ out-of-sample days."}
  - id: b_k2_14
    case: pass_multi
    class: K2
    expect: reject
    note: number inserted into a template text segment (not a narrative paragraph), both files consistent
    ops:
      - {op: text_replace, old: "That makes the strategy a candidate", new: "Over 23 years of data, that makes the strategy a candidate"}
  - id: b_k2_15
    case: volfrag
    class: K2
    expect: reject
    note: ordinal/rank quantity ('the second-best arm') and 'tenth of a Sharpe' magnitude hidden in a benign-looking sentence
    ops:
      - {op: insert_llm, section: portfolio, text: "Ridge-CV, the second-best arm, trailed the leader by a tenth of a Sharpe point."}

  # ---------------------------------------------------------------- K3 fact id repointed
  - id: b_k3_01
    case: pass_multi
    class: K3
    expect: reject
    note: Ridge-CV row's gross Sharpe cell repointed to DRO-CV's gross Sharpe (1.64)
    ops:
      - {op: atom_replace, old: "{fact:portfolio.ridge_cv.sharpe|value}", new: "{fact:portfolio.dro_cv.sharpe|value}"}
  - id: b_k3_02
    case: pass_multi
    class: K3
    expect: reject
    note: passenger caveat lists s_conf's B twice instead of s_real's, while the following sentence still talks about s_real's interval including zero
    ops:
      - {op: atom_replace, old: "{fact:portfolio.s_real.b}", new: "{fact:portfolio.s_conf.b}"}
  - id: b_k3_03
    case: pass_multi
    class: K3
    expect: reject
    note: stress table's high-volatility cell for Ridge-CV repointed to the other-days Sharpe (1.77)
    ops:
      - {op: atom_replace, old: "{fact:stress.ridge_cv_high|value}", new: "{fact:stress.ridge_cv_low|value}"}
  - id: b_k3_04
    case: pass_multi
    class: K3
    expect: reject
    note: killed s_noise's BH q cell repointed to s_real's q (< 0.001)
    ops:
      - {op: atom_replace, old: "{fact:causal.s_noise.q|value}", new: "{fact:causal.s_real.q|value}"}
  - id: b_k3_05
    case: pass_multi
    class: K3
    expect: reject
    note: killed s_decay's decline p repointed to s_conf's (0.352), contradicting its decay kill
    ops:
      - {op: atom_replace, old: "{fact:decay.s_decay.p|value}", new: "{fact:decay.s_conf.p|value}"}
  - id: b_k3_06
    case: realistic
    class: K3
    expect: reject
    note: not_detectable caveat's realistic-strength power rate (0.140) repointed to the base-preset rate, so the caveat cites 0.844 twice
    ops:
      - {op: atom_replace, old: "{fact:ref.realistic_stage1_power}", new: "{fact:ref.base_stage1_power}"}
  - id: b_k3_07
    case: hidden_confounder
    class: K3
    expect: reject
    note: deciding Ridge-CV LW p repointed to DRO-FC's 0.015, which would be a pass although the portfolio was killed
    ops:
      - {op: atom_replace, old: "{fact:portfolio.ridge_cv.lw_p|value}", new: "{fact:portfolio.dro_fc.lw_p|value}"}
  - id: b_k3_08
    case: stage2_short
    class: K3
    expect: reject
    note: s_decay's causal q cell repointed to s_conf's q (1.000) while s_decay is shown as passing Stage 1
    ops:
      - {op: atom_replace, old: "{fact:causal.s_decay.q|value}", new: "{fact:causal.s_conf.q|value}"}
  - id: b_k3_09
    case: volfrag
    class: K3
    expect: reject
    note: s_volfrag's decline p repointed to s_real's, hiding the decline that killed it
    ops:
      - {op: atom_replace, old: "{fact:decay.s_volfrag.p|value}", new: "{fact:decay.s_real.p|value}"}
  - id: b_k3_10
    case: hidden_confounder
    class: K3
    expect: reject
    note: Ridge-CV's deflated Sharpe cell repointed to Markowitz's DSR (0.976)
    ops:
      - {op: atom_replace, old: "{fact:portfolio.ridge_cv.dsr|value}", new: "{fact:portfolio.markowitz.dsr|value}"}
  - id: b_k3_11
    case: pass_single
    class: K3
    expect: reject
    note: the causal-screen level atom repointed to the Stage 2 level (same value 0.05), a repoint invisible in memo.md
    ops:
      - {op: atom_replace, old: "{fact:causal.s_conf.alpha|value}", new: "{fact:decay.s_real.alpha|value}"}

  # ---------------------------------------------------------------- K4 verdicts
  - id: b_k4_01
    case: portfolio_kill
    class: K4
    expect: reject
    note: s_real's portfolio kill rewritten as 'passed all three kill stages' in the md signals table
    ops:
      - {op: md_replace, old: "| s_real | s_real was killed at Stage 3 (portfolio construction) by its test (portfolio.no_edge_over_equal_weight) |", new: "| s_real | s_real passed all three kill stages |"}
  - id: b_k4_02
    case: pass_multi
    class: K4
    expect: reject
    note: Ridge-CV's Decides cell flipped yes -> no in json and md, so no arm decides
    ops:
      - {op: text_replace, old: "yes", new: "no"}
  - id: b_k4_03
    case: pass_multi
    class: K4
    expect: reject
    note: implied stability verdict ('edge held up') after a correct fate atom, contradicting the decay_power caveat
    ops:
      - {op: insert_llm, section: decay, text: "{fate:s_conf}, so its edge held up over the whole sample."}
  - id: b_k4_04
    case: hidden_confounder
    class: K4
    expect: reject
    note: false verdict - the portfolio was killed, narrative says its advantage was confirmed
    ops:
      - {op: insert_llm, section: portfolio, text: "The portfolio's advantage over {term:one_over_n} was confirmed by the kill test."}
  - id: b_k4_05
    case: portfolio_kill
    class: K4
    expect: reject
    note: kill reframed as 'effectively a pass' without any verdict keyword like passed/killed
    ops:
      - {op: insert_llm, section: portfolio, text: "Ridge-CV came within a whisker of beating equal weight, which for practical purposes is as good as clearing the bar."}
  - id: b_k4_06
    case: realistic
    class: K4
    expect: reject
    note: kill read as absence of an edge ('none is genuinely predictive'), contradicting not_detectable
    ops:
      - {op: insert_llm, section: causal, text: "None of these signals is genuinely predictive of the asset returns."}
  - id: b_k4_07
    case: pass_multi
    class: K4
    expect: reject
    note: negation verdict - s_noise's kill restated as 'shown to have no effect'
    ops:
      - {op: insert_llm, section: causal, text: "The screen showed that s_noise has no effect on returns."}
  - id: b_k4_08
    case: volfrag
    class: K4
    expect: reject
    note: denies the decline that killed s_volfrag and invents a regime explanation
    ops:
      - {op: insert_llm, section: decay, text: "s_volfrag's edge did not really decline; its exit reflects a switch in volatility, not decay."}
  - id: b_k4_09
    case: stage2_short
    class: K4
    expect: reject
    note: s_real was killed without a test decision (insufficient data), narrative says the decay test rejected it
    ops:
      - {op: insert_llm, section: decay, text: "s_real was rejected by the decay test."}
  - id: b_k4_10
    case: pass_multi
    class: K4
    expect: reject
    note: template block's verdict rule misstated (family p instead of BH q), both files consistent
    ops:
      - {op: text_replace, old: "The verdict uses the BH q-value at the ", new: "The verdict uses the family p-value at the "}
  - id: b_k4_11
    case: not_decided
    class: K4
    expect: reject
    note: not_decided recommendation block flipped to 'was ruled out'
    ops:
      - {op: text_replace, old: "That signal was not ruled out", new: "That signal was ruled out"}
  - id: b_k4_12
    case: pass_single
    class: K4
    expect: reject
    note: s_conf (killed at Stage 1) said to clear the causal screen alongside s_real
    ops:
      - {op: insert_llm, section: causal, text: "s_conf cleared the causal screen alongside s_real."}
  - id: b_k4_13
    case: volfrag
    class: K4
    expect: reject
    note: correct B atom juxtaposed with a false reading (its interval includes zero, and B never decides)
    ops:
      - {op: insert_llm, section: portfolio, text: "{fact:portfolio.s_decay.b}, which confirms that s_decay contributes a real edge of its own."}
  - id: b_k4_14
    case: portfolio_kill
    class: K4
    expect: reject
    note: false comparative in stress - here equal weight (1.68) beat Ridge-CV (1.50) in the high-volatility state
    ops:
      - {op: insert_llm, section: stress, text: "{fact:stress.ridge_cv_high}, so the deciding arm weathered turbulence better than equal weight."}

  # ---------------------------------------------------------------- K5 recommendation
  - id: b_k5_01
    case: pass_multi
    class: K5
    expect: reject
    note: recommendation field flipped to 'against trading' though two signals passed
    ops:
      - {op: set_field, field: recommendation, value: "against trading"}
  - id: b_k5_02
    case: hidden_confounder
    class: K5
    expect: reject
    note: recommendation flipped to 'candidate for paper trading' though nothing survived
    ops:
      - {op: set_field, field: recommendation, value: "candidate for paper trading"}
  - id: b_k5_03
    case: not_decided
    class: K5
    expect: reject
    note: not decided flipped to 'against trading'
    ops:
      - {op: set_field, field: recommendation, value: "against trading"}
  - id: b_k5_04
    case: pass_single
    class: K5
    expect: reject
    note: md-only recommendation line upgraded to 'trade'
    ops:
      - {op: md_replace, old: "Recommendation: candidate for paper trading.", new: "Recommendation: trade."}
  - id: b_k5_05
    case: pass_multi
    class: K5
    expect: reject
    note: narrative upgrades the recommendation to a live allocation
    ops:
      - {op: insert_llm, section: recommendation, text: "We recommend allocating capital to this strategy now."}
  - id: b_k5_06
    case: portfolio_kill
    class: K5
    expect: reject
    note: against-trading run, narrative suggests a small live position anyway
    ops:
