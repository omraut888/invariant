  - id: b_k6_13
    case: pass_multi
    class: K6
    expect: reject
    note: md-only deletion of the 'description, not a certification' sentence of stress_description
    ops:
      - {op: md_replace, old: "It is a description, not a certification, and it never decides. ", new: ""}
