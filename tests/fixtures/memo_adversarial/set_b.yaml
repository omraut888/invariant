  # ---------------------------------------------------------------- K7 citations
  - id: b_k7_01
    case: pass_multi
    class: K7
    expect: reject
    note: Ledoit-Wolf citation removed from the kill-test sentence (and from the bibliography, to stay consistent)
    ops:
      - {op: delete_atom, atom: "{cite:ledoit2008}"}
      - {op: delete_reference, key: ledoit2008}
  - id: b_k7_02
    case: pass_multi
    class: K7
    expect: reject
    note: Andrews citation year altered to a nonexistent work in memo.md (Andrews 1994)
    ops:
      - {op: md_replace, old: "(Andrews 1993)", new: "(Andrews 1994)"}
  - id: b_k7_03
    case: pass_multi
    class: K7
    expect: reject
    note: uncited literature claim attributed by name ('Andrews showed')
    ops:
      - {op: insert_llm, section: decay, text: "Andrews showed that sup-type tests lose power when a break falls near the end of the sample."}
  - id: b_k7_04
    case: hidden_confounder
    class: K7
    expect: reject
    note: uncited 'the literature finds' claim
    ops:
      - {op: insert_llm, section: causal, text: "The literature finds that most published anomalies are driven by common factors."}
  - id: b_k7_05
    case: pass_single
    class: K7
    expect: reject
