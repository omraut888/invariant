  - id: b_k5_07
    case: stage2_short
    class: K5
    expect: reject
    note: not-decided run, narrative paraphrases 'against trading'
    ops:
      - {op: insert_llm, section: recommendation, text: "In practice the evidence leans against putting money behind any of these signals."}
  - id: b_k5_08
    case: pass_single
    class: K5
    expect: reject
    note: template recommendation block negation removed ('and a recommendation to trade')
    ops:
      - {op: text_replace, old: "not a recommendation to trade", new: "and a recommendation to trade"}
  - id: b_k5_09
    case: volfrag
    class: K5
    expect: reject
    note: correct recommendation atom extended with 'ready for deployment'
    ops:
      - {op: insert_llm, section: recommendation, text: "{recommendation}, and ready for deployment."}
  - id: b_k5_10
    case: realistic
    class: K5
    expect: reject
    note: slang paraphrase of a recommendation ('a clear no-go')
    ops:
      - {op: insert_llm, section: recommendation, text: "This one is a clear no-go."}
  - id: b_k5_11
    case: pass_multi
    class: K5
    expect: reject
    note: recommendation stated in the stress narrative, far from the recommendation section, with no recommendation keyword
    ops:
      - {op: insert_llm, section: stress, text: "Nothing here should stop a desk from sizing up the position."}

  # ---------------------------------------------------------------- K6 mandatory statements
  - id: b_k6_01
    case: pass_multi
    class: K6
    expect: reject
    note: triggered passenger caveat deleted
    ops:
      - {op: delete_statement, id: passenger}
  - id: b_k6_02
    case: hidden_confounder
    class: K6
    expect: reject
    note: triggered collateral caveat deleted
    ops:
      - {op: delete_statement, id: collateral}
  - id: b_k6_03
    case: hidden_confounder
    class: K6
    expect: reject
    note: spurious passenger caveat added (portfolio was killed; collateral applies, not passenger)
    ops:
      - {op: add_statement, id: passenger}
  - id: b_k6_04
    case: pass_single
