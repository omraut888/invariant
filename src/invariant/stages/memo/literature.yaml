# Curated literature corpus for Stage 5 memos (docs/adr/0017).
# Bibliographic metadata plus a one-line summary written by us. No text from the papers is stored.
# Every entry is cited by an ADR; `stages` lists where the memo cites it automatically.
entries:
  - key: runge2019
    authors: [Runge, Nowack, Kretschmer, Flaxman, Sejdinovic]
    year: 2019
    title: Detecting and quantifying causal associations in large nonlinear time series datasets
    venue: Science Advances 5(11)
    doi: 10.1126/sciadv.aau4996
    summary: Introduces PCMCI, a two-step causal discovery method for time series (PC1 parent selection, then momentary conditional independence tests).
    stages: [causal]
  - key: runge2018
    authors: [Runge]
    year: 2018
    title: Causal network reconstruction from time series - From theoretical assumptions to practical estimation
    venue: Chaos 28(7)
    doi: 10.1063/1.5025050
    summary: Reviews the assumptions of time-series causal discovery (causal sufficiency, faithfulness, stationarity) and when they fail.
    stages: [causal]
  - key: mackinnon1985
    authors: [MacKinnon, White]
    year: 1985
    title: Some heteroskedasticity-consistent covariance matrix estimators with improved finite sample properties
    venue: Journal of Econometrics 29(3)
    doi: 10.1016/0304-4076(85)90158-7
    summary: Proposes the HC2 and HC3 heteroskedasticity-consistent covariance estimators; HC3 has better small-sample size.
    stages: [causal]
  - key: white1980
    authors: [White]
    year: 1980
